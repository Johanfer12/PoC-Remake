[preset.0]
name="Android Tablet"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="*.pck,*.json,*.sha256"
exclude_filter="tests/*,temp/*,artifacts/*"
export_path="../artifacts/android/PowerOfChaos-tablet-v21.apk"
script_export_mode=2

[preset.0.options]
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=21
version/name="0.21-first-run-import"
package/unique_name="org.porttesting.powerofchaos"
package/name="Power of Chaos"
package/signed=true
launcher_icons/main_192x192="res://assets/icons/launcher.svg"
launcher_icons/adaptive_foreground_432x432="res://assets/icons/launcher-adaptive-foreground.svg"
launcher_icons/adaptive_background_432x432="res://assets/icons/launcher-adaptive-background.svg"
launcher_icons/adaptive_monochrome_432x432="res://assets/icons/launcher-adaptive-monochrome.svg"
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/internet=true
permissions/access_network_state=true
permissions/access_wifi_state=true

permissions/change_wifi_multicast_state=true
